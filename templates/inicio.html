{% extends "base.html" %}


{% block contenido %}
<head><link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<style>
    .redes-portada {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-top: 25px;
    margin-bottom: 30px;
}

.red-social {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 12px 20px;

    border-radius: 50px;

    text-decoration: none;

    color: white;

    font-weight: 600;

    font-size: 15px;

    transition: all 0.3s ease;

    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.red-social i {
    font-size: 22px;
}

.red-social:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
}

.whatsapp {
    background: #25D366;
}

.instagram {
    background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
    );
}

@media (max-width: 600px) {

    .redes-portada {
        gap: 10px;
    }

    .red-social {
        padding: 11px 16px;
        font-size: 14px;
    }

    .red-social i {
        font-size: 20px;
    }
}

.portada {

    min-height: 75vh;

    display: flex;

    align-items: center;

    justify-content: center;


    background-image: url('/static/img/fondo_donas.jpg');

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;


    border-radius: 30px;

    overflow: hidden;

    position: relative;

}


/* Oscurece un poco la imagen para que se lea el texto */
.portada::before {

    content: "";

    position: absolute;

    inset: 0;

    background: rgba(0,0,0,0.35);

}



.contenido-portada {

    position: relative;

    z-index: 2;

    text-align: center;

    color: white;

    padding: 50px;

}



/* Sombra para que el texto destaque */

.contenido-portada h1,
.contenido-portada p {

    text-shadow: 2px 2px 8px rgba(0,0,0,0.8);

}



.contenido-portada h1 {

    font-size: 60px;

    font-weight: 800;

}



.contenido-portada p {

    font-size: 24px;

}



.btn-portada {

    border-radius: 20px;

    padding: 12px 35px;

    font-size: 20px;

    font-weight: bold;

    transition: .3s;

}



.btn-portada:hover {

    transform: scale(1.05);

}



</style>



<div class="portada">


    <div class="contenido-portada">


        <h1>
            🍩 Mini Tentaciones
        </h1>


        <p>
            Donas artesanales hechas con amor ❤️
        </p>



        <a href="{{ url_for('catalogo') }}"
           class="btn btn-warning btn-portada mt-3">

            🛒 Ver catálogo

        </a>



        <!-- REDES SOCIALES -->
<div class="redes-portada">

    <a href="https://wa.me/5492612070017"
       target="_blank"
       class="red-social whatsapp">
        <i class="bi bi-whatsapp"></i>
        <span>WhatsApp</span>
    </a>

    <a href="https://instagram.com/minii_tentacioness_ayc"
       target="_blank"
       class="red-social instagram">
        <i class="bi bi-instagram"></i>
        <span>Instagram</span>
    </a>

</div>


    </div>


</div>



{% endblock %}
